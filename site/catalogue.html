<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue — Fonds P. Nwyia</title>
<meta name="description" content="Searchable catalogue of the manuscripts in Paul Nwyia's collection, filterable by city, library, author and publication status.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">Fonds P.&nbsp;Nwyia <span class="ar">فِهرِس مجموعة نُويا</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="catalogue.html" class="active">Catalogue</a>
      <a href="authors.html">Authors</a>
      <a href="scholarship.html">Scholarship</a>
      <a href="about.html">About</a>
    </div>
  </div>
</nav>

<header class="hero" style="padding:2.5rem 0 1.75rem;">
  <div class="container">
    <div class="eyebrow">Index des Lieux</div>
    <h1 style="font-size:2rem;margin:0;">Catalogue</h1>
    <p class="lead" style="margin:.5rem 0 0;">Search and filter the collection by place, author and the publication status of each text.</p>
  </div>
</header>

<div class="controls">
  <div class="container controls-inner">
    <div class="search">
      <input type="search" id="q" placeholder="Search title, author, shelfmark…" autocomplete="off">
    </div>
    <div class="field"><label for="f-city">City</label><select id="f-city"></select></div>
    <div class="field"><label for="f-lib">Library</label><select id="f-lib"></select></div>
    <div class="field"><label for="f-auth">Author</label><select id="f-auth"></select></div>
    <div class="field"><label for="f-status">Status</label><select id="f-status"></select></div>
    <div class="field"><label for="f-sort">Sort</label>
      <select id="f-sort">
        <option value="place">By place</option>
        <option value="author">By author</option>
        <option value="status">By status</option>
      </select>
    </div>
    <div class="field field-clear">
      <button type="button" id="f-clear" class="btn-clear" hidden>Clear filters</button>
    </div>
  </div>
</div>

<main class="container">
  <div class="result-count" id="count" role="status" aria-live="polite"></div>
  <div id="results"><div class="loading">Loading catalogue…</div></div>
</main>

<footer>
  <div class="container footer-grid">
    <div><strong>Fonds P. Nwyia — Index des Lieux</strong></div>
    <div>Bibliographic data in part from
      <a href="https://digitalsufism.github.io/" target="_blank" rel="noopener">Digital Sufism</a>.</div>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const STATUS = { published:"Published edition", manuscript:"Manuscript only", unknown:"Status unknown", partial:"Partially published" };

let ROWS = [], CLU = new Map();

function clusterLabel(r) {
  const c = CLU.get(r.author_cluster_id);
  return c ? (c.canonical_translit || "") : "";
}
function clusterAr(r) {
  const c = CLU.get(r.author_cluster_id);
  return c ? (c.canonical_ar || "") : "";
}
function clusterDates(r) {
  const c = CLU.get(r.author_cluster_id);
  return c ? (c.dates || "") : "";
}
// The fullest attested nasab, shown under the short name — but only when it adds
// something the short name doesn't already say.
function clusterFullName(r) {
  const c = CLU.get(r.author_cluster_id);
  const full = c ? (c.full_name || "") : "";
  return full && full !== (c.canonical_translit || "") ? full : "";
}

// ---- Filter state -----------------------------------------------------------
// Held in the URL so a filtered view can be linked, bookmarked and cited, and so
// the Back button steps through the filters the reader actually applied.
const FIELDS = { q:"q", city:"city", library:"library", author:"author",
                 status:"status", sort:"sort" };
const CONTROL = { q:"q", city:"f-city", library:"f-lib", author:"f-auth",
                  status:"f-status", sort:"f-sort" };

function currentState() {
  const s = {};
  for (const k in CONTROL) s[k] = $(CONTROL[k]).value.trim();
  return s;
}

function stateFromUrl() {
  const p = new URLSearchParams(location.search);
  const s = {};
  for (const k in FIELDS) s[k] = (p.get(FIELDS[k]) || "").trim();
  // An author deep link may arrive as a cluster id (c001) or as the canonical
  // transliteration. Accept both; the control speaks transliteration.
  if (s.author && CLU.has(s.author)) s.author = CLU.get(s.author).canonical_translit || "";
  if (!s.sort) s.sort = "place";
  return s;
}

function writeUrl(state, push) {
  const p = new URLSearchParams();
  for (const k in FIELDS) {
    if (k === "sort" && state[k] === "place") continue;   // the default
    if (state[k]) p.set(FIELDS[k], state[k]);
  }
  const url = location.pathname + (p.toString() ? "?" + p : "") + location.hash;
  if (push) history.pushState(state, "", url);
  else history.replaceState(state, "", url);
}

function applyState(state) {
  for (const k in CONTROL) {
    const el = $(CONTROL[k]);
    // A value no longer offered (a narrowed facet) falls back to "all".
    if (k === "q") el.value = state[k] || "";
    else el.value = [...el.options].some(o => o.value === state[k]) ? state[k] : "";
  }
}

function fillSelect(el, values, allLabel) {
  const keep = el.value;
  el.innerHTML = `<option value="">${allLabel}</option>` +
    values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if (values.includes(keep)) el.value = keep;
}

// A facet's options are computed from the rows matching every OTHER facet, so
// choosing a city narrows the library list to the libraries that city actually
// has — rather than offering all 37 and letting the reader pick an empty result.
function populateFilters() {
  const s = currentState();
  const without = skip => ROWS.filter(r => matches(r, {
    q: skip === "q" ? "" : s.q,
    city: skip === "city" ? "" : s.city,
    library: skip === "library" ? "" : s.library,
    author: skip === "author" ? "" : s.author,
    status: skip === "status" ? "" : s.status,
  }));
  const uniq = (rows, k) => [...new Set(rows.map(r => (r[k] || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));

  fillSelect($("f-city"), uniq(without("city"), "city"), "All cities");
  fillSelect($("f-lib"), uniq(without("library"), "library"), "All libraries");
  fillSelect($("f-auth"),
    [...new Set(without("author").map(clusterLabel).filter(Boolean))].sort((a,b)=>a.localeCompare(b)),
    "All authors");
  const statuses = without("status");
  fillSelect($("f-status"),
    Object.keys(STATUS).filter(k => statuses.some(r => (r.pub_status || "unknown") === k)),
    "Any status");
  [...$("f-status").options].forEach(o => { if (o.value) o.textContent = STATUS[o.value] || o.value; });
}

function matches(r, s) {
  if (s.city && (r.city||"") !== s.city) return false;
  if (s.library && (r.library||"") !== s.library) return false;
  if (s.author && clusterLabel(r) !== s.author) return false;
  if (s.status && (r.pub_status||"unknown") !== s.status) return false;
  if (s.q) {
    const hay = [r.title, r.title_translit, r.title_translation, r.author, clusterLabel(r),
                 clusterAr(r), clusterFullName(r), clusterDates(r), r.catalog_note,
                 r.shelfmark, r.archive, r.city, r.library].join(" ").toLowerCase();
    if (!s.q.toLowerCase().split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

function sortRows(rows, mode) {
  const by = (...fns) => (a,b) => { for (const f of fns){ const d=f(a,b); if(d) return d; } return 0; };
  // Blank sorts LAST. A "~" sentinel does not achieve that: localeCompare treats
  // punctuation as sorting before letters, so unplaced rows led the place index.
  const s = k => (a,b) => {
    const x = (a[k]||"").trim(), y = (b[k]||"").trim();
    if (!x !== !y) return x ? -1 : 1;
    return x.localeCompare(y);
  };
  if (mode === "author") return rows.sort(by((a,b)=>clusterLabel(a).localeCompare(clusterLabel(b)), s("city")));
  if (mode === "status") {
    const ord = { published:0, partial:1, manuscript:2, unknown:3 };
    return rows.sort(by((a,b)=>(ord[a.pub_status||"unknown"]-ord[b.pub_status||"unknown"]), s("city")));
  }
  return rows.sort(by(s("city"), s("library"), s("shelfmark")));
}

// ---- Place index ------------------------------------------------------------
const NO_PLACE = "Holding institution not recorded";

function placeKey(r) {
  const city = (r.city || "").trim(), lib = (r.library || "").trim();
  if (!city && !lib) return NO_PLACE;
  return `${city || "City not recorded"}␀${lib || "Library not recorded"}`;
}

function placeHeading(key, n) {
  const count = `<span class="place-count">${n} manuscript${n === 1 ? "" : "s"}</span>`;
  if (key === NO_PLACE) {
    return `<h2 class="place-head">${esc(NO_PLACE)}${count}
      <span class="place-note">Items in the fonds carrying only a cote — largely
      Nwyia's own offprints, typescripts and working papers.</span></h2>`;
  }
  const [city, lib] = key.split("␀");
  return `<h2 class="place-head"><span class="place-city">${esc(city)}</span>
    <span class="place-sep">›</span> <span class="place-lib">${esc(lib)}</span>${count}</h2>`;
}

// Group into place sections, preserving the order rows already arrived in (the
// place sort has run), and floating the no-place bucket to the end — it is a
// residue, not a location, and should not head an index of places.
function groupByPlace(rows) {
  const groups = new Map();
  for (const r of rows) {
    const k = placeKey(r);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  const keys = [...groups.keys()].filter(k => k !== NO_PLACE);
  if (groups.has(NO_PLACE)) keys.push(NO_PLACE);
  return keys.map(k => [k, groups.get(k)]);
}

function entryHtml(r, level, grouped) {
  const status = r.pub_status || "unknown";
  const badge = `<span class="badge badge-${esc(status)}">${esc(STATUS[status]||status)}</span>`;
  const translit = r.title_translit ? `<div class="entry-translit">${esc(r.title_translit)}</div>` : "";
  const transln = r.title_translation ? `<div class="entry-translation">${esc(r.title_translation)}</div>` : "";
  const authTranslit = clusterLabel(r);
  const authAr = r.author || clusterAr(r);
  const authDates = clusterDates(r);
  const authFull = clusterFullName(r);
  const author = (authAr || authTranslit) ? `<div class="entry-author">
      ${authAr ? `<span class="ar-inline">${esc(authAr)}</span>` : ""}
      ${authTranslit ? ` &nbsp;·&nbsp; <span class="translit">${esc(authTranslit)}</span>` : ""}
      ${authDates ? `<span class="entry-author-dates">${esc(authDates)}</span>` : ""}
    </div>${authFull ? `<div class="entry-author-full">${esc(authFull)}</div>` : ""}` : "";
  // Under a place heading the city and library are already stated; repeating them
  // on every entry is noise.
  const meta = [
    !grouped && r.city && `<span><b>City:</b> ${esc(r.city)}</span>`,
    !grouped && r.library && `<span><b>Library:</b> ${esc(r.library)}</span>`,
    r.shelfmark && `<span><b>Shelfmark:</b> ${esc(r.shelfmark)}</span>`,
    r.folios && `<span><b>Folios:</b> ${esc(r.folios)}</span>`,
    r.archive && `<span><b>Fonds cote:</b> <span class="cote">${esc(r.archive)}</span></span>`,
  ].filter(Boolean).join("");
  let cite = "";
  if (r.pub_citation) cite = `<div class="entry-cite">${esc(r.pub_citation)}` +
    (r.work_url ? ` — <a href="${esc(r.work_url)}" target="_blank" rel="noopener">view edition ↗</a>` : "") + `</div>`;
  else if (r.work_url) cite = `<div class="entry-cite"><a href="${esc(r.work_url)}" target="_blank" rel="noopener">identification / catalogue ↗</a></div>`;
  const note = r.discrepancy_note ? `<div class="entry-cite muted">⚠ ${esc(r.discrepancy_note)}</div>` : "";
  // The cataloguer's own description of the item — its physical form (texte
  // imprimé, lithographie), or a statement that the index records no title.
  const catNote = r.catalog_note ? `<div class="entry-note">${esc(r.catalog_note)}</div>` : "";
  // An entry with no title is not a rendering failure: the Fonds index simply
  // records none. Say that, rather than showing a bare dash.
  const title = r.title
    ? `<${level} class="entry-title">${esc(r.title)}</${level}>`
    : `<${level} class="entry-title entry-untitled">Untitled</${level}>`;
  // A citable anchor for the individual manuscript. The row id is the key: the
  // Fonds cote cannot be, because one cote covers a whole bundle (345 rows carry
  // a cote but only 162 are distinct, and cote 082 alone covers 12 entries).
  const link = `<a class="entry-permalink" href="#${esc(r.id)}"
    aria-label="Permalink to this entry (${esc(r.id)})" title="Permalink to this entry">¶</a>`;
  return `<article class="entry" id="${esc(r.id)}">
    <div class="entry-head">
      <div>
        ${title}${link}
        ${translit}${transln}${author}
      </div>
      <div>${badge}</div>
    </div>
    <div class="entry-meta">${meta}</div>
    ${catNote}${cite}${note}
  </article>`;
}

function render() {
  // Narrow the facets FIRST: a selection that is no longer offered is dropped
  // here, and the filtering below must see that, not the stale value.
  populateFilters();
  const s = currentState();
  const out = sortRows(ROWS.filter(r => matches(r, s)), s.sort);
  const filtered = Object.keys(FIELDS).some(k => k !== "sort" && s[k]);
  $("f-clear").hidden = !filtered;

  $("count").textContent = out.length === ROWS.length
    ? `${ROWS.length} manuscripts`
    : `${out.length} of ${ROWS.length} manuscripts`;

  if (!out.length) {
    $("results").innerHTML = `<div class="loading">No manuscripts match these filters.</div>`;
    return;
  }
  if (s.sort === "place") {
    // A place index should show its places. Entries sit at h3 under the h2 heading.
    $("results").innerHTML = groupByPlace(out).map(([key, rows]) =>
      `<section class="place-group">${placeHeading(key, rows.length)}
        ${rows.map(r => entryHtml(r, "h3", true)).join("")}</section>`).join("");
  } else {
    $("results").innerHTML = out.map(r => entryHtml(r, "h2", false)).join("");
  }
}

// Highlight the entry a permalink points at, and bring it into view. Called after
// a render, so it works on first load as well as on a later hash change.
function focusHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  document.querySelectorAll(".entry-target").forEach(e => e.classList.remove("entry-target"));
  el.classList.add("entry-target");
  // Measure the sticky stack rather than assuming a fixed offset: the control bar
  // wraps to three or four rows on a narrow viewport, where a fixed scroll-margin
  // would drop the cited entry underneath it. The bar also stops being sticky
  // below 860px, in which case it takes up no scroll offset at all.
  const nav = document.querySelector(".nav"), ctl = document.querySelector(".controls");
  const sticky = nav.offsetHeight +
    (getComputedStyle(ctl).position === "sticky" ? ctl.offsetHeight : 0);
  // Instant, not smooth: the page sets scroll-behavior:smooth globally, and
  // animating tens of thousands of pixels to a cited entry either takes seconds
  // or is cancelled part-way, leaving the reader stranded near the top.
  window.scrollTo({
    top: el.getBoundingClientRect().top + window.scrollY - sticky - 12,
    behavior: "instant",
  });
}

// A permalink must resolve even when the saved filters would hide its entry —
// otherwise a cited URL silently shows nothing. Clear them and say so.
function ensureHashVisible() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id || !ROWS.some(r => r.id === id)) return;
  if (document.getElementById(id)) return;
  applyState({ q:"", city:"", library:"", author:"", status:"", sort: currentState().sort });
  render();
  writeUrl(currentState(), false);
}

function update(push) {
  render();
  writeUrl(currentState(), push);
}

let t;
const debounced = () => { clearTimeout(t); t = setTimeout(() => update(false), 150); };

fetch("../data/data.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => {
    (d.clusters || []).forEach(c => CLU.set(c.cluster_id, c));
    // Exclude "modern" clusters (Nwyia's own studies, colleagues, modern authors)
    // from the manuscript catalogue — they live on the Scholarship page instead.
    const modern = new Set((d.clusters || []).filter(c => c.category === "modern").map(c => c.cluster_id));
    ROWS = (d.rows || []).filter(r => !modern.has(r.author_cluster_id));

    populateFilters();
    applyState(stateFromUrl());
    render();
    ensureHashVisible();
    focusHash();
    writeUrl(currentState(), false);    // canonicalise (e.g. ?author=c001 → the name)

    $("q").addEventListener("input", debounced);
    ["f-city","f-lib","f-auth","f-status","f-sort"]
      .forEach(id => $(id).addEventListener("change", () => update(true)));
    $("f-clear").addEventListener("click", () => {
      applyState({ q:"", city:"", library:"", author:"", status:"", sort: currentState().sort });
      update(true);
    });
    window.addEventListener("popstate", () => {
      applyState(stateFromUrl());
      render();
      focusHash();
    });
    window.addEventListener("hashchange", () => { ensureHashVisible(); focusHash(); });
  })
  .catch(e => { $("results").innerHTML = `<div class="loading">Could not load the catalogue (${esc(e.message)}).</div>`; });
</script>
</body>
</html>
